name: Build & Test

run-name: ${{ github.actor }} is running Build & Test

on:
  pull_request:
    branches:
      - master

env:
  MASSIVE_TOKEN: ${{ secrets.MASSIVE_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'
      - run: |
          dotnet clean Massive.Client.sln
          dotnet restore Massive.Client.sln
          dotnet build Massive.Client.sln

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'
      - run: |
          dotnet test Massive.Client.sln